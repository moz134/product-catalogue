name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-smoke:
    name: Docker Compose + Mailpit smoke test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 180
      - run: ./scripts/smoke-test.sh
      - name: Service logs on failure
        if: failure()
        run: docker compose logs

  ios:
    name: iOS - unit and UI tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./scripts/test-ios.sh -derivedDataPath apps/ios/build CODE_SIGNING_ALLOWED=NO
